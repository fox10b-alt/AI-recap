name: Ban tin AI hang ngay
on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python agent.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs
          git commit -m "Cap nhat ban tin" || echo "Khong co thay doi"
          git push
